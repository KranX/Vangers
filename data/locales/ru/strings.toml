# Item and mechos descriptions: UTF-8 paragraphs; U+2028 separates the title.
"descriptions.item.01" = "Махотин \"Мясорубка\" Мощный скорострельный пулемет, входивший в вооружение первопроходцев-софти на последних стадиях Освоения. Оборудован автономной системой формирования боеприпасов, позволяющей на ходу с помощью химической обработки и последующего взрывного сжатия под большим давлением в активной камере получать пули из обыкновенного грунта или пыли. Энергия сжатия также передаёт боеприпасу значительный кинетический потенциал. Для каталитической реакции требует значительного количества воды, запасы которой периодически нужно пополнять из любых доступных источников на поверхности миров."
"descriptions.item.02" = "Махотин \"Мясорубка\" Мощный скорострельный пулемет, входивший в вооружение первопроходцев-софти на последних стадиях Освоения. Оборудован автономной системой формирования боеприпасов, позволяющей на ходу с помощью химической обработки и последующего взрывного сжатия под большим давлением в активной камере получать пули из обыкновенного грунта или пыли. Энергия сжатия также передаёт боеприпасу значительный кинетический потенциал. Для каталитической реакции требует значительного количества воды, запасы которой периодически нужно пополнять из любых доступных источников на поверхности миров."
"descriptions.item.03" = "Спитл Система \"Дурной глаз\" Мобильная ракетная установка софти для ведения войны на больших открытых пространствах. Использует неуправляемые или самонаводящиеся ракеты с пластикулярным зарядом. Пластикулярный материал характеризуется чрезвычайно высокой молекулярной активностью и эффективно взаимодействует с любым веществом, разрушая практически любые твердые образования. Запасы пластикула ограничены и этот материал относительно дорог, но имеет высокую поражающую способность."
"descriptions.item.04" = "Спитл Система \"Дурной глаз\" Мобильная ракетная установка софти для ведения войны на больших открытых пространствах. Использует неуправляемые или самонаводящиеся ракеты с пластикулярным зарядом. Пластикулярный материал характеризуется чрезвычайно высокой молекулярной активностью и эффективно взаимодействует с любым веществом, разрушая практически любые твердые образования. Запасы пластикула ограничены и этот материал относительно дорог, но имеет высокую поражающую способность."
"descriptions.item.05" = "гОрб Генератор \"Последний спазм\" Одно из последних изобретений исчезнувших после Конфликта спиритов-мессий для борьбы с полчищами криспо. Генерирует квазистабильные плазменные сгустки, обладающие существенной разрушительной силой. Работает от специального внутреннего источника энергии(BM - \"Iris Ball Mother\"), требующего подзарядки. Стационарные автономные BM-генераторы в свое время устанавливались повсеместно и ныне сохранилось несколько работоспособных станций на поверхности миров Цепи."
"descriptions.item.06" = "гОрб Генератор \"Последний спазм\" Одно из последних изобретений исчезнувших после Конфликта спиритов-мессий для борьбы с полчищами криспо. Генерирует квазистабильные плазменные сгустки, обладающие существенной разрушительной силой. Работает от специального внутреннего источника энергии(BM - \"Iris Ball Mother\"), требующего подзарядки. Стационарные автономные BM-генераторы в свое время устанавливались повсеместно и ныне сохранилось несколько работоспособных станций на поверхности миров Цепи."
"descriptions.item.07" = "Биббаноза Блокада \"Сос-Ка-Либри\" Изобретение одного из Ушедших Биосов, смонтировавших его из различных механизмов, оставшихся после Конфликта. Основными компонентами боеприпасов являются бибы (примитивные инсекты, населяющие поверхность миров и служащие денежной единицей для всех банчей). Множество уникальных химически-активных веществ, содержащихся в бибах, позволяет после специальной высокотемпературной обработки использовать их как термитные фугасы, которые с силой выбрасываются наружу и детонируют при столкновении с препятствиями."
"descriptions.item.08" = "Крастест Мортира \"Кувалда\" Строительная установка поселенцев-софти для устранения геологических препятствий, приспособленная впоследствии для ведения боевых действий. Обладает колоссальной разрушительной силой, которой не может противостоять ни один мехос. Требует внешних бомбовых зарядов, технология изготовления которых давно утеряна."
"descriptions.item.09" = "Терминатор \"Выползок\" Разновидность криспоидных боевых инсект-механизмов, преследующих выбранную после необратимой активации цель под землей. Не требует никаких вспомогательных устройств, полностью автономен."
"descriptions.item.10" = "Терминатор \"Овод\" Носитель колонии миниатюрных инсект-механизмов. После активации колония начинает роиться в воздухе, нападая на взлетающие обекты. Не требует никаких вспомогательных устройств, полностью автономен."
"descriptions.item.11" = "Пупки Комплект неуправляемых ракет для Speetle System (5 штук). Пластикулярный боеприпас, обладающий чрезвычайно высокой молекулярной активностью и эффективно взаимодействующий с любым веществом, разрушая практически любые твердые образования."
"descriptions.item.12" = "Окорока Комплект ракет для Speetle System (5 штук), оснащенных системой распознавания тонких упорядоченных структур для эффективного слежения за целью, комплектуемых пластикулярными боеголовками."
"descriptions.item.13" = "Болтун Боеприпас для Crustest Cannon (5 штук). Обладает колоссальной разрушительной силой. Ранее использовался в строительных работах для устранения геологических препятствий. Технология изготовления утеряна."
"descriptions.item.14" = "КоптеРиг Автономное устройство, позволяющее мехосу подниматься в воздух и совершать управляемый полет с возможностью зависания над поверхностью. Принцип действия основан на создании локальных пространственных аномалий с инверсной гравитацией. Работает от собственного аккумулятора, заряжаемого на специальных подстанциях."
"descriptions.item.16" = "КаттеРиг Автономное устройство, позволяющее мехосу преодолевать водные преграды. Принцип действия основан на использовании турбулентного парадокса. Работает от собственного аккумулятора, заряжаемого на специальных подстанциях. В сравнении с CopteRig имеет гораздо больший ресурс работы до подзарядки."
"descriptions.item.18" = "КротРиг Автономный прибор, позволяющий мехосу проникать в толщу грунта. Принцип действия базируется на мгновенных малопротяженных сдвигах пространственных решеток, диссоциирующих на время любые твёрдые образования. Не нуждается в частой подзарядке."
"descriptions.item.20" = ""
"descriptions.item.21" = ""
"descriptions.item.22" = "Вектор Устройство, позволяющее обеспечить примитивную систему наведения оружия на цель."
"descriptions.item.24" = "Нюхонтейнер Герметичный контейнер для перевозки нюхи без значительной потери её свойств. Особая технология изготовления контейнера позволяет значительно понижать скорость энтропии, замедляя процесс разложения нестабильных летучих веществ."
"descriptions.item.26" = "Куккиш Изделие Ушедших Биосов, позволившее им обрести контроль над своими Куклами и \"закупориться\". Представляет собой ловушку-контейнер для Куклы. Принцип действия неизвестен. Предположительно, основывается на утерянных знаниях о метаболизме криспоидной Семьи."
"descriptions.item.27" = "Нимбос На этом товаре новички зарабатывают свои первые бибы. Он получается из старых элиподов. Мокрый, скользкий и противный. Но некоторые его очень любят."
"descriptions.item.28" = "Флегма Банка со слизью. В Инкубаторе, по слухам, её целые реки. Наверное, чтобы местных не затопило, приходится всё время слизь из эскейва вывозить. Жутко воняет. После извоза приходится чистить трюм."
"descriptions.item.29" = "Героин Упакованный и обмотанный бибурат. Пока едешь, всё время ворочается и орёт мерзким голосом глупые героические гимны. Иногда воет. Шумный товарец. Но упакован крепко."
"descriptions.item.30" = "Куст Упакованный бибурат, утыканный шипами. Соплеменники обзывают их \"неприкаянными\". Не орёт, только вздыхает. Иногда бормочет про какое-то Бюро. Видно, что не повезло балбесу. Говорят, что Обурец проращивает бедняг в горшках с помощью пипеток."
"descriptions.item.31" = "Попонка Слепленная из чего-то гадкого табличка. На ней циксы царапают разные закорючки. Везти нужно осторожно. Хрупкий политический товар."
"descriptions.item.32" = "Токсик Посудина с мутной жижей. Мерзкая дрянь. Ничего хуже на Некроссе не найдёшь. Если прольёшь, начинает разъедать мехос изнутри. Подлые циксы норовят потравить всех в Цепи этой гадостью."
"descriptions.item.33" = "eLeech Культовая единица. Субъект Элирекции - ритуала элиподов"
"descriptions.item.34" = ""
"descriptions.item.35" = ""
"descriptions.item.36" = ""
"descriptions.item.37" = "Начертатель Замороченная вещица как-то связанная с Икспло. Непростая побрякушка, каких немного в Цепи. Выделывает разные занятные фокусы. Может даже защитить тебя. Если уж ты сумел раздобыть её, сумей и не упустить шанс ей воспользоваться."
"descriptions.item.38" = "Механический Мессия Зловещий предмет. Не иначе как порождение невидимых хозяев Трилла. Если он попал тебе в руки, значит ты заехал на дорогу, с которой нет возврата. Вангер, владеющий этим уродцем, делается начисто свихнувшимся. Он может вызывать всякие таинственные силы и наводить ужас на каждого встречного - но не может отсрочить свой страшный конец."
"descriptions.item.39" = "Способ-83+ Очень полезная вещица. Не все верят, что она есть на самом деле. Личный Коридор в любой мир прямо у себя в трюме - хорошее приобретение, не так ли? Поговаривают даже, что она может закинуть тебя туда, куда не в состоянии проникнуть Спираль."
"descriptions.item.40" = "Спумия Если и есть вещь страшнее Механического Мессии, то это только застывшее тело неизвестного существа. Всем биосам Спумия внушает смертельный ужас. Появление её на Мирах всегда предвещало ужасные события. Наследие софти заставляет трястись от страха даже самых тупоголовых."
"descriptions.item.41" = "Липуринга Размалёванное уродство, игрушка для жадного элипода, гениальная ловушка для чесалок."
"descriptions.item.42" = ""
"descriptions.item.43" = "Раббокс Ошейник, который бибураты цепляют всем вангерам, попавшим им в лапы. Если потерять эту жестянку, щедрые бибураты ещё раз тебя ею осчастливят, сделав нищим рабом. По раббоксу они узнают, насколько полезен вангер для бибуратов. Поэтому, чтобы выбраться из их объятий, приходится играть в дурацкие игры и беречь раббокс."
"descriptions.item.44" = "Погремушка Если потрясти эту ерунду, внутри что-то грохочет. Похоже на сушёных бибов."
"descriptions.item.45" = "Тележка Такие колёса могут принадлежать только огромному страшному мехосу. Такими, вероятно, хорошо давить раффа."
"descriptions.item.46" = "Моторчик Замысловатые потроха для корявого катафалка."
"descriptions.item.47" = "Коробка Колёсики в этой коробке давно не крутятся, зачем она нужна - непонятно. Бесполезное барахло."
"descriptions.item.48" = "Трещётка Очень красивая железка. Как-то один олух приделал её на крышу своего мехоса. Пугал ею бибов, но вскоре помер."
"descriptions.item.49" = "Тяжёлая железка Тот, кто притащил такую тяжесть, был недалёкого ума. Этой дурой хорошо укреплять потолки в эскэйвах."
"descriptions.item.50" = "Звёздочка Эту железку привезли с Икспло. Её выдрали из старого ржавого механизма, который показался из зыбучих песков после бури."
"descriptions.item.51" = "Вертушка Одно время эта штука закрывала дырку на въезде в бибуратский эскэйв. Потом её заткнули огромным бибуратом, а железку выкинули."
"descriptions.item.52" = "Молотилка Как-то эта коробочка сама вдруг завелась в кладовой элипода и чуть не поотрывала тому чесалки - дурила принял ее за кузовок, чуть не лишившись жизни."
"descriptions.item.53" = "Ерунда с зубчиками Куда вставить эту железку никто не представляет. Некоторые думают, что это странная ракета, которая может взорваться при неосторожном обращении."
"descriptions.item.54" = "Танкацид Этот сувенир с мрачнейшего из проклятых миров привозят самые ушлые и бесстрашные вангеры. Старый советник бибуратов клянётся, что если добавить в танкацид пару сушёных бибов и попасть этой смесью по вражескому мехосу, он растворяется прямо на глазах. Циксы готовы отдать последнее, чтобы заполучить отраву, разъедающую железо быстрее токсика в десять раз."
"descriptions.item.55" = "Пилот Когда тебе надоело следить за дорогой и давить прытких бибов, с помощью этого прибора ты можешь показать мехосу, куда ему надо ехать. И он доставит тебя в нужную точку. Хоть и не быстро, но верно."
"descriptions.item.56" = "Бут Сектор Если ты, наконец, разжился бибами и стал заправским старателем нюхи, надо подумать о том, как расширить свои владения. Эта вещица может в одно мгновение переселять вангера из одного мехоса в другой, и даже спасать его из заварушки перекидывая в ближайший эскейв. Обладатель этого артефакта практически неуязвим - на каждом мире он может иметь сразу по несколько мехосов!"
"descriptions.item.57" = "Инкарнатор Проклятый подарок обитателей Трилла. Похититель мехосов. Если тебе надоело копить бибы на приличный катафалк, можешь взять себе этот шар. Останется только выследить мехос поприличней и запустить в него этой штуковиной. Если он попадёт в трюм бедолаге, то новым хозяином этого мехоса со всеми его потрохами станешь ты сам! А его старый владелец перекочует в твою старую колымагу. Этот предмет явно сварганили, чтобы вангеры не дремали на дорогах."
"descriptions.item.58" = "Глюк Активная протоплазма, продукт цивилизации софти. При активации \"чувствует\" любые неполадки в сложных механизмах и восстанавливает их работоспособность. Применяется для ремонта мехосов на ходу."
"descriptions.item.59" = "Деградатор Весёлый сувенир с Трилла. Если тебя угораздило подвязаться на расправу с вангером на грузовике, то без этого шара тебе не обойтись. Запусти им в мехос своей жертвы и будь наготове. Если твой подарочек попадёт тому в трюм, то негодяй уменьшиться в несколько раз - тут-то его и дави как беззащитного биба! Только действуй побыстрее, а не то рискуешь вновь встретиться в разъярённым громилой."
"descriptions.item.60" = "Табутаск Все банчи пользуются этим средством, чтобы заставить вангеров на них побатрачить. Что внутри сначала неизвестно - открывается уже на поверхности, и там уже как повезет. Вангеры, боящиеся табутасков, скоро нищают и становятся раффа."
"descriptions.item.61" = "Ампутатор Этот сфероид ушлые вангеры добывают в мрачных закоулках Трилла. Хороший сюрприз для неопытных механиков. Когда они видят на дороге такой красивый предмет, сразу берут его себе в трюм. И тут начинается веселье. Мехос не может шевельнуть колесом, только прыгает и перекатывается. Бери его голыми руками - но быстро!"
"descriptions.item.62" = "Элипод Червяк, которого, наконец-то, пробило на поездку. Всё время беспокойно ворочается, хнычет и жалуется на тряску, плохую связь со стручком и злую судьбу. При виде встречного вангера страшно булькает и пачкает трюм."
"descriptions.item.63" = "Бибурат Грубая бибуратская образина. Если не воет песни, не орёт команды, то учит управлять мехосом. Пытается выскочить и поймать встечных рабов, отдавая им приказ взрываться. Лучшая награда - когда он свалит."
"descriptions.item.64" = "Цикса Беспокойная тварь. На месте не сидит. Пытается взлететь. Это у них привычка. Не останавливаясь, травит непонятные анекдоты, одновременно хихикая и почёсываясь обеими лапами. Иногда начинает громко хохотать, показывая на встречных вангеров."
"descriptions.item.65" = "Палочка Есть предположение, что этой вещицей элиподы помешивают в себе нимбос. Но никто никогда этого не видел, так как толстяки тщательно скрывают свои секреты."
"descriptions.item.66" = "Пипка Слепленное из глины подобие семени жабля. Старый Обурец почти ослеп и частенько принимает ее за настоящую пипетку, но горе тому, кто попадется на подлоге!"
"descriptions.item.67" = "Дробус Мусор неизвестной природы. Лучше утопить его где-нибудь поглубже на Глорксе. Иначе Гиря найдет способ наказать умника, пытающегося подсунуть ему фальшивый ядробус."
"descriptions.item.68" = "Буравчик Босс бибуратов собственной персоной. На поверку это довольно маленький и крикливый тип. Но быть личным водителем этого коротышки - большая честь для вангера!"
"descriptions.item.69" = "Перепонка Это шпаргалка циксов. По ней Цыфра сверяет правильность попонок."
"descriptions.item.70" = "Цифик Икра омерзительной твари. Осторожнее с ней."
"descriptions.item.71" = ""
"descriptions.item.72" = ""
"descriptions.item.77" = ""
"descriptions.mechos.00" = "Кислый Монк Почтенный старик, много повидавший на своём веку. На Фострале есть ещё живые очевидцы как на нём обставили четырёх пустоголовых зубоскалов-циксов в навороченных колясках в большой гонке с Инкубатора, поотшибав попутно у тех стволов на кучу бибов. Удача прочно поселилась в этом механизме."
"descriptions.mechos.01" = "Пернатый Санитар Его давно облюбовали отчаянные торговцы с Глоркса. На нём они не боялись сунутся за нюхой даже в дебри некроссовских болот. А сколько добра вывезли на малыше с Икспло, отбиваясь от жадных и тупых рэйнджеров, скажут только они сами, шамкая сквозь вывернутые челюсти. Ездившие на нём шепнут по секрету, что надо только не мешать ему, тогда он сам вынесет тебя из любой передряги."
"descriptions.mechos.02" = "Мгновенный Если тебя, наконец, окончательно переклинило от непутёвой вангерской жизни, и ты созрел для последней прогулки в преисподнюю секретных миров, то лучшего катафалка для своих весёлых похорон не найти. Нажми на газ и этот мехос сам доставит тебя в такую переделку, о которой уже никто не сможет ни услышать, ни догадаться, если удача хоть на миг посмотрит не на тебя."
"descriptions.mechos.03" = "Потрошитель Все знают, что занудные жлобы элиподы готовы продаться с потрохами за любую побрякушку. Они собрали в своих норах огромные кучи барахла со всех миров и теперь трясутся над ним. . . Горе нечистому на руку вангеру, лишившего толстяка его сокровища. Безжалостный и неутомимый убийца на этом угрюмом угловатом ящике расквитается с воришкой очень быстро. До сих пор многие, увидев его куда-то спешащим, думают: \"Вот и ещё один пустоголовый нашёл свой конец, порывшись в закромах Липкого\"."
"descriptions.mechos.04" = "Мамочка Мехос для королей дорог. По слухам на таком же везли Куклу для некроссовских банчей. Немногие вернулись с того весёлого променада у Закупоренного Коридора. Толстушка заставила уважать себя многих. С той поры многие лихие вангеры не считают зазорным промчаться с ветерком на этом мехосе, поднимая пыль и расшвыривая зазевавшихся бибов."
"descriptions.mechos.05" = "Дряхлый Душегуб Это излюбленный мехос отчаянных рейнджэров, искателей приключений на свою голову и настоящих разбойников. Когда надоедает выслушивать бредовые поучения ожиревших советников и быть у них на побегушках, если ты устал пересчитывать жалкие бибы до окончания цикла, присоединяйся к весёлому племени вольных бродяг. Пускай торгаши ломают головы, где раздобыть товар и где подороже загнать барахло - твоё дело лишь найти время и место для \"тёплой\" встречи."
"descriptions.mechos.06" = "Железный Призрак Когда-то на подобных разъезжали весёлые охотники на раффа. Только на нём можно было загнать в горах вертлявую, сумасшедше отстреливающуюся колымагу одичавших недоносков или уйти по воде от разъярённой толпы, уверенной, что ты уже спёкся, осталось только навострить жвала и отрыгнуть пищеварительный фермент."
"descriptions.mechos.07" = "атТрактор Уникальный мехос, собранный когда-то из остатков дорожно-ремонтной и тунелледробительной техники. Чокнутые бибураты просто обожают его. Под ножами этого монстра многие закончили свою гонку, напоровшись на засаду. Червяки-элиподы, рассекая даже на до зубов бронированных катафалках, случалось, падали перед ним в канаву, испытывая суеверный ужас перед Каретоубийцей."
"descriptions.mechos.08" = "Песколаз Когда-то этот необычный мехос принадлежал одному неприкаянному вангеру. Он снюхался с таинственными обитателями Трилла, которых никто никогда не видел в глаза. Они ему и подсказали как собрать такое чудовище. Потом вангера долго ещё видели на разных мирах выполняющим поручения своих хозяев, которые снабдили его таким оружием, что, завидев его на горизонте, каждый разворачивался и давил на газ со всех сил. Затем его мехос нашли пустым и в полном порядке. С тех пор никто не хочет пробовать даже сесть на него."
"descriptions.mechos.09" = "Арканоид На всех мирах этот мехос прославился благодаря одной захватывающей истории. Неугомонные зубоскалы циксы наплели одному простаку сказок про Короля Бибов. Описали какой он огромный, в половину мехоса, с огромными клешнями, быстро бегает и питается исключительно зазевавшимися вангерами. В конце-концов предложили ему привезти гадину живьём за огромные деньги. Замороченный вангер начал готовиться к охоте с размахом, собрав для начала хорошо забронированный мехос со специальным захватом. Чем закончилась история, говорить не надо. Однако мехос и до сих пор хорошо подходит для любого охотника - но не за несчастным Королём, конечно."
"descriptions.mechos.10" = "Безумный Коновал Этот мехос носит гордое звание Короля Древности. Его когда-то целиком откопали элиподы, ковыряясь в своих эскейвах. Как он попал под землю, никто не знает. Однако циксы клянутся, что на подобных катафалках разъезжали самые могучие софти, полумифическое племя, некогда посещавшее эти миры. Они ,видимо, были неплохими вангерами, ибо на этом механизме было выиграно множество гонок с нанесением тяжких повреждений соперникам. В их ржавой утробе до сих пор витают духи первых извращенных владельцев."
"descriptions.mechos.11" = "Пуля Свою славу малыш добыл на Некроссе. Сплюснутость помогает ему продираться сквозь такие заросли, куда не проползёт даже биб. Смрадные болота, поглотившие многих отчаянных вангеров, словно выплёвывают этот мехос, не желая его попробовать на вкус. Нет такой лужи на Некроссе, по которой не проехались бы его широкие колёса."
"descriptions.mechos.12" = "Клёпаный Гроб Эти мехосы всё, что осталось нам от Ушедших Биосов. Это были крутые племена, с лучшими мехосами и самыми отчаянными вангерами. По легенде, после того, как их банчи собрали три Куклы, остальные решили проучить хапуг. Толпы вангеров блокировали эскейвы, не позволяя ни одному мехосу ни въехать, ни выехать оттуда. Но все планы расстроили эти огромные грузовики. После выезда на громады бросались кучи крутых мехосов, точно раффа на зазевавшегося торговца, и начинались весёлые скачки. Очень редко удавалось завалить такого монстра, чей путь отмечали кучи горящих обломков. Ушедшие оставилили хорошие сувениры на память, этот - самый лучший."
"descriptions.mechos.13" = "Прокалыватель Этот увалень давно стал символом торговой удачи. Кто на мирах не слышал о Мамочке Бибов! Кажется невероятным, но как только ты останавливаешься на нём в любом месте, к мехосу сразу начинают сползаться бибы, как-будто им чем-то намазано. Эти твари просто обожают свою Мамочку - и это неспроста. Вангер не будет испытывать недостатка в бибах - так говорят испытавшие эту машину."
"descriptions.mechos.14" = "Реаниматор Этот крепыш навсегда прославил себя в ритуальных гонках Глоркса. Даже бестолковые циксы ухитрялись доверху набить отсеки семенами (за них бибураты платят не торгуясь!), не потеряв при этом ни одного и даже хорошенько причесав подвернувшихся попутно ловцов чужой удачи. Если не хочешь терять своего навара, бери себе этот мехос и не думай ни о чём."
"descriptions.mechos.15" = "Последний из Могикан Это мехос для короля вангеров, настоящий эскейв на колёсах, в котором можно не боятся ничего и никого и ехать по головам остальной мелюзги. Когда эта груда металла приближалась к эскейвам элиподов, те не могли разобрать, что трясётся сильнее: стены глубоких нор или их жирные туши от страха."
"descriptions.mechos.16" = "Жаба Когда-то на таких мехосах разъезжали по Глорксу патрули бибуратов, ловившие беглых рабов. А все знют, что раб для бибурата - всякий вангер, не играющий в их дурацкие игры. С этой колымагой на водном Глорксе никто и не тягался. В конце-концов там уже никто не мог проехать. И порешили свободные вангеры на лучших катафалках показать выродкам урок. Была жаркая битва, однако бибураты всё равно утёрли всем нос. Но патрули убрали, поняли намёк. С тех пор и ждёт этот мехос нового сумасшедшего."
"descriptions.mechos.17" = "Винтокрыл Этот нескладный мехос у нормального вангера вызывает недоумение. По земле катить привычней, нежели всё время болтаться в воздухе. Да и история у летучки зловещая. Говорят, что в самом начале времён на таких же устройствах ужасные \"мягкие\" вангеры преследовали наших предков, стараясь отобрать у них Кукол. Только в эскейвах можно было укрыться от напасти. Ещё поговаривают, что сохранился целый мир с мягкими, которые только и ждут своего часа - ворваться сюда и всё уничтожить."
"descriptions.mechos.18" = "БЛОХ Эти чудо-мехосы были когда-то давным-давно сделаны Ушедшими Биосами для борьбы с расплодившимися бибами, которые вредили их подземным плантациям. Ни одна букашка не могла уйти от отважных охотников на этих быстрых катафалках, которые до того поднаторели в истреблении несчастных шестиногих, что бибы, завидев их, до сих пор забиваются в глубокие щели и долго оттуда не показываются."
"descriptions.mechos.19" = "СМОК Этот мехос является самым излюбленным для раффа. На нём всегда можно спрятаться в любую щель, отсиживаясь во время погони. Известна история, как один вор, стащивший что-то у советника элиподов, сумел уйти на плюгавом от двух охотников на грузовиках. Он проскользнул у них чуть ли не между колёсами, после чего догоняющие столкнулись и взорвались! А вора всё-таки подстрелила пара спелых грибов, но это уже к делу не относится."
"descriptions.mechos.20" = "МОТОК Этот тарантас лучше всего подойдёт для любителей наблюдать чужую драку со стороны. Пока остолопы усердно выбивают друг у друга ценные предметы обихода, всегда можно улучшить момент, чтобы подобрать нужную вещицу и скрыться с глаз долой. А можно наподдать кому-нибудь и быть уверенным в безнаказанности. Юркий раффа всегда сможет заработать бибов, не лезя на рожон."
"descriptions.mechos.21" = "ШРОТ Хоть раффа и мал, да быстр и злобен. А когда собираются много таких тараканов, то торгаши ездят очень осторожно, крутя головами во все стороны. На Некроссе одно время лютовала крупная стая отщепенцев на таких телегах, которые охотились по всем правилам. После того, как одни заманивали мехос в болото, другие выныривали прямо из грязи и завершали дело. Одно время медленные элиподы из-за этой банды даже не могли получать долгожданную нюху. Только крупные денежные траты на раффа-ассенизаторов избавили их от этой напасти."
"descriptions.mechos.22" = "ДОХОД По виду этого заморыша никак не скажешь, что он заставлял потеть от злости многих поднаторевших вангеров. Некогда ни одна гонка на Фострале не обходилась без участия славного раффа, заполучив себе культовый предмет, он как одержимый мчался к цели, оставляя позади многих знаменитостей и ловко уворачиваясь от пущенных ракет. Элиподы очень любили гонщика. Главное для него было выбраться после победы из эскейва, чтобы не напороться на мстящих неудачников."
"descriptions.mechos.35" = "Червонец Несколько таких мехосов зловредные бибураты собрали, чтобы добраться до подземных инкубаторов элиподов и потом безнаказанно унести ноги. Долго они посещали тёмные пещеры, набитые деликатесами, пока элиподы не забили тревогу после срыва своей ритуальной гонки. Это и было причиной знаменитого !естиваля Терминаторов. После очередного налёта наёмники элиподов выпустили сотни терминаторов, некоторые неизвестных доселе конструкций и устроили ворам урок! Долго ещё после этого сбившиеся с цели механизмы нападали на проезжих вангеров. А этот мехос еще ждёт любителей внезапных атак из-под земли."
