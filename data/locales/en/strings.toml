# Item and mechos descriptions: UTF-8 paragraphs; U+2028 separates the title.
"descriptions.item.01" = "Mincelot Machine Gun A mighty quick-firing machine gun which was the weapon of the Softie troops during the final stages of the Exploration. Equipped with an on-board ammunition maker which shapes bullets 'on the fly' from plain soil or dust through special chemical processing and subsequent squeezing in the burner under high pressure. The energy from this squeezing also gives the bullet significant kinetic impulse. The catalytic reaction consumes considerable amounts of water, requiring periodic refueling from any available source on the surface of the worlds."
"descriptions.item.02" = "Mincelot Machine Gun A mighty quick-firing machine gun which was the weapon of the Softie troops during the final stages of the Exploration. Equipped with an on-board ammunition maker which shapes bullets 'on the fly' from plain soil or dust through special chemical processing and subsequent squeezing in the burner under high pressure. The energy from this squeezing also gives the bullet significant kinetic impulse. The catalytic reaction consumes considerable amounts of water, requiring periodic refueling from any available source on the surface of the worlds."
"descriptions.item.03" = "Speettle True Tracer System A Softie mobile rocket launcher for combat in large open areas. Uses regular or guided missiles with plasticular charge. Plasticular material is characterized by very high molecular activity and is effectively reactive with virtually any hard substance, destroying it completely. The supply of plasticular is limited, and this material is relatively expensive, but it has a high destructive power."
"descriptions.item.04" = "Speettle True Tracer System A Softie mobile rocket launcher for combat in large open areas. Uses regular or guided missiles with plasticular charge. Plasticular material is characterized by very high molecular activity and is effectively reactive with virtually any hard substance, destroying it completely. The supply of plasticular is limited, and this material is relatively expensive, but it has a high destructive power."
"descriptions.item.05" = "Salamander Ghorb Gear One of the last inventions of the Infinite Mind who disappeared after the Clash. Used against crowds of Cryspo. Generates quasi-stable plasmoids possessing significant destructive power. Powered by a special on-board energy supply which requires recharging. Stationary autonomous Ghorb power stations were installed everywhere at the time of the Clash, and some remain up and running in the present."
"descriptions.item.06" = "Salamander Ghorb Gear One of the last inventions of the Infinite Mind who disappeared after the Clash. Used against crowds of Cryspo. Generates quasi-stable plasmoids possessing significant destructive power. Powered by a special on-board energy supply which requires recharging. Stationary autonomous Ghorb power stations were installed everywhere at the time of the Clash, and some remain up and running in the present."
"descriptions.item.07" = "Sos-Calibre Beebbanoza Blockade An invention of a Transmundane Bios who assembled it from parts of various machines that survived after the Clash. The main component used for ammunition is beebs, primitive insects which live on the surfaces of the worlds and serve as a medium of exchange for all bunches. The beebs contain many unique chemically active substances which allow them to be used as thermal bombs after special high-temperature processing. Then, when they are thrown with force, they explode upon hitting the target."
"descriptions.item.08" = "Sledgehammer Crustest Cannon A construction mechanism of the Softie used for eliminating geological barriers, it was later adapted for combat. Possesses great destructive capacity that no mechos can survive. Requires an external supply of bombs, the secret of whose production was lost long ago."
"descriptions.item.09" = "Wormier Terminator A variant of Cryspo combat insect-mechanisms that follow an acquired target underground after their irrevocable activation. Requires no additional devices, completely autonomous."
"descriptions.item.10" = "Wasp Terminator Carries a colony of small insect-mechanisms. After activation, the colony swarms in the air and attacks any object trying to take off. Requires no additional devices, completely autonomous."
"descriptions.item.11" = "Pupok Pack A pack of projectiles for the Speettle System (10 pcs). Carries plasticular charge, characterized by very high molecular activity and effectively reactive with virtually any hard substance, destroying it completely."
"descriptions.item.12" = "Okorok Pack A pack of guided missiles for Speettle System (8 pcs) equipped with a targeting system capable of recognizing complex ordered patterns for effective target tracking. Carries plasticular warheads."
"descriptions.item.13" = "Boltoon Pack Ammo for the Crustest Cannon (5 pcs). Possesses great destructive power. It was used in construction for eliminating geological barriers. Its production technique has been lost."
"descriptions.item.14" = "CopteRig An autonomous device which enables a mechos to go up into the air and then move or hover. Works on the principle of local spatial disturbances with inverted gravitation. Powered by a separate storage battery which can be recharged at special stations."
"descriptions.item.16" = "SkimRig An autonomous device which allows a mechos to go over water barriers. Works on the principle of turbulent paradox. Powered by a separate storage battery which can be recharged at special stations. The time this device can function between recharges is much greater than the CopteRig's."
"descriptions.item.18" = "DigRig An autonomous device which allows the mechos to penetrate into the ground. Works on the principle of momentary low-duration shifts of spatial grids that temporarily dissociate hard substances. Does not require frequent recharges."
"descriptions.item.20" = ""
"descriptions.item.21" = ""
"descriptions.item.22" = "Vector A device for primitive target tracking."
"descriptions.item.24" = "Cirtainer A hermetic container that allows the transportation of cirt without significant loss of its qualities. Produced with a special technique that significantly reduces entropy, thus slowing the decay of volatile substances."
"descriptions.item.26" = "Conlarver A product of the Transmundane Bios which allowed them to take control over their Larvae and shut themselves up. It's both a trap and a container for a Larva. How it works is unknown. Supposedly it's based on knowledge of the metabolism of the Cryspo colony which has been lost."
"descriptions.item.27" = "Nymbos This is where greenhorns earn their first beebs. It comes from old Eleepods and is wet, slimy, and disgusting. But some love it."
"descriptions.item.28" = "Phlegma A jar of mucus. Rumors say there's a whole flood of this stuff in Incubator. To avoid suffocating, the inhabitants need somebody to cart it away all the time. Stinks like hell. After carrying it, your hold needs a good cleaning."
"descriptions.item.29" = "Valorin A packed, wrapped Beeboorat. While you're carrying it, he tumbles about all and belts out stupid songs in a nasty voice. Sometimes howls. Very noisy type. But at least he's packed well."
"descriptions.item.30" = "Shrub A packed Beeboorat stuck full of spikes. His fellows call him a \"castaway.\" Doesn't yell at all, but groans. Sometimes mumbles something about some kind of Buro. Looks like he's an unlucky fella. Rumor has it that Oboorez uses pipettes to sprout these guys in pots."
"descriptions.item.31" = "Popon A woven pad made of some kind of smooth material. Zeexen scribble on it. It's a fragile and politically important item. Needs careful transportation."
"descriptions.item.32" = "Toxick A vessel holding some kind of muddy pulp. Yucky stuff. There's nothing worse in all of Necross. If you spill it, this stuff gnaws at the mechos' insides. The malicious Zeexen want to poison all of the living creatures in the Chain with this guck."
"descriptions.item.33" = "eLeech A cultic article. An integral part of Eleerection, an eleepods' ritual."
"descriptions.item.34" = ""
"descriptions.item.35" = ""
"descriptions.item.36" = ""
"descriptions.item.37" = "Protractor A perplexing gizmo that is somehow related to Xplo. A device this complex is a rare find on The Chain. Able of performing various amusing tricks and can even protect you at times. Once you've acquired one, keep a sharp eye out for your chance to use it."
"descriptions.item.38" = "Mechanical Messiah An evil device. None other than the unseen masters of Threall could have created it. The day you find this thing in your hands is the day you step onto a dark path with no return. Any vanger possessing it turns completely insane. He is capable of summoning mysterious forces and striking fear into the heart of anyone on his path, but he can't delay his own dreadful end."
"descriptions.item.39" = "Function-83+ A very useful thing. Some don't even believe it really exists. A private Passage into any world right in your hold would be great, wouldn't it? Rumor has it that it can even take you places you can't go with the Spiral."
"descriptions.item.40" = "Chomper If there's anything scarier than the Mechanical Messiah, it's this mummified body of an unknown creature. All the bios shudder in horror at the sight of it. Its appearance on a world has always been an omen of a coming disaster. This legacy of the Softie makes even the dullest creatures tremble."
"descriptions.item.41" = "Leepuringa Painted ugliness. A toy for a greedy Eleepod, and a great trap for scratchers."
"descriptions.item.42" = ""
"descriptions.item.43" = "Rubbox A dog collar that Beeboorats put on every vanger they catch. If you lose this piece of tin, the generous Beeboorats will bestow it on you again, making you a poor slave all over again. By his rubbox, the Beeboorats can tell how useful a vanger is for them. So, to free yourself from their control, you have to play their stupid games and take care of your rubbox."
"descriptions.item.44" = "Zig-Zagger (Sandrider part I) When you shake this, something rattles around inside. Sounds like dried beebs."
"descriptions.item.45" = "Cart (Sandrider part II) These wheels could only belong to a huge, scary mechos. They're probably good for riding down beebs."
"descriptions.item.46" = "Motor (Last Mohican part I) The complicated bowels of some craggy buggy."
"descriptions.item.47" = "Box (Last Mohican part II) The wheels of this box don't work. Why it's still even around is unknown. Useless junk."
"descriptions.item.48" = "Rattle (Queen Frog part I) A very nice piece of metal. Some blockhead once fixed it to the top of his mechos. He went off scaring beebs for some time, but he died soon after."
"descriptions.item.49" = "Heavy Metal (Queen Frog part II) Whoever brought this heavy beast with him was definitely not right in the head. But it makes a good support for escave ceilings."
"descriptions.item.50" = "Star (Lawn Mower part I) This piece of metal was brought here from Xplo. They took it out of some old rusty machine that came out of the sand after a storm."
"descriptions.item.51" = "Whizzer (Lawn Mower part II) This piece of metal used to cover the entrance of a Beeboorat escave. Later, they covered it with a huge Beeboorat and threw this away."
"descriptions.item.52" = "Husker (Wormmaster part I) This clockwork widget once started working on its own in an Eleepod's cellar and nearly cut his scratchers off!"
"descriptions.item.53" = "Cogged Widget (Wormmaster part II) Nobody has any idea where to put this. Some think it's some strange kind of missile that might explode if handled carelessly."
"descriptions.item.54" = "Tankacid Only the toughest and smartest vangers can get this souvenir from the darkest of the cursed worlds. The old Beeboorat counselor swears that if you put a couple of dried beebs into tankacid and pour it onto a hostile mechos, it will dissolve right before your eyes. Zeexen would give her last beeb for this stuff, which eats away iron ten times faster than toxick."
"descriptions.item.55" = "Flymatic When you're tired of driving and trying to catch these agile beebs, you can use this widget. Show your mechos where to go and it will get you there. Maybe not quickly, but reliably."
"descriptions.item.56" = "Boot Sector If you've gotten rich at last and have become a cirt hunter of the highest class, it's time to expand your domain. This gadget can instantly transfer a vanger from one mechos to another and even extract him out of a jam and into the nearest escave. This artifact makes its owner virtually invulnerable - he can even have several mechos on a world at the same time!"
"descriptions.item.57" = "Incarnator A damned gift of the inhabitants of Threall. It's a mechos stealer. If you've tired of saving up the beebs for a decent buggy, get this ball. Track down a worthy mechos and throw this gadget at it. If it lands right in the mechos's hold, you'll become the new owner of the mechos, including all of its equipment! The old owner will end up in your ride. They probably made this widget so vangers don't sleep on the road."
"descriptions.item.58" = "Gluek Active protoplasm. A product of the Softie civilization. Once activated, it senses any malfunctions in complex mechanisms and repairs them automatically. Used to repair mechos on the fly."
"descriptions.item.59" = "Degradator An interesting souvenir from Threall. If something in this hell forces you to deal with a vanger, you can't do without this ball. Throw it at your enemy's mechos and get ready. If your gift lands right in his hold, the scamp will get several times smaller in size. Then you just trample him like a beeb!"
"descriptions.item.60" = "Tabutask All of the bunches use this to make vangers work for them. When you take it, you don't know what's inside. It's just the luck of the draw what's there when you come up to the surface and open it. But vangers who steer clear of tabutasks soon get poor and become raffa."
"descriptions.item.61" = "Amputator Cunning vangers get this spheroidal widget from the dark nooks of Threall. It's a good surprise for inexperienced mechanics. When they spot this nice shiny object on the road, they grab it immediately and put it in their hold. And that's where the fun begins. The mechos gets paralyzed and can't move a wheel. It just hops and tumbles around. Pick it up with your bare hands, but act quickly!"
"descriptions.item.62" = "Eleepod A worm that one day ventured to take a trip. He tumbles about all the time, whines and grumbles about the joggle, the bad connection with the pod, and his ill fate. At the sight of an approaching vanger he bubbles up in fear and messes his hold."
"descriptions.item.63" = "Beeboorat A rude beeboorattish monkey. If he's not bellowing songs or shouting out orders, than he's teaching you how to drive your mechos. Sometimes he tries to jump out and catch approaching slaves while ordering them to explode. The best reward for carrying him is the moment he leaves."
"descriptions.item.64" = "Zeex A restless beast. Never sits calmly, tries to fly up all the time. Just a habit. Tells odd jokes all the time, while continuously giggling and scratching herself with both paws. At times she breaks into laughter, pointing at approaching vangers."
"descriptions.item.65" = "Stick It's rumored that Eleepods use this thing to stir nymbos. But nobody has really ever seen this, since the fatties hide their secrets carefully."
"descriptions.item.66" = "Pip A clay article shaped like a Jablee seed. Old Oboorez often mistakes it for real pipette. But anyone caught for forgery is in big trouble!"
"descriptions.item.67" = "Noboom Some stuff of an unknown nature. It'd be a good idea to throw it into some deep ditch on Glorx, or Geer'ah will find a way to punish the rascal who tries to present it to him pretending it's genuine Nucleoboom."
"descriptions.item.68" = "Boorawchick The Beeboorat boss himself. He looks small and his voice is grating, but it's always an honor for a vanger to be this dwarf's personal driver."
"descriptions.item.69" = "Poponlist A Zeexen checklist. Zeephra checks popons with it."
"descriptions.item.70" = "Zeefick The spawn of some yucky beast. Gotta be careful with it."
"descriptions.item.71" = ""
"descriptions.item.72" = ""
"descriptions.item.77" = ""
"descriptions.mechos.00" = "Oxidized Monk This old fella has seen a lot in his days. There are still living witnesses left on Fostral who saw these things triumph in the big race from the Incubator. They mopped the floor with four boneheaded Zeexen scoffers and their fancy dragsters and salvaged guns worth tons of beebs. Luck favors this machine."
"descriptions.mechos.01" = "Feathered Surgeon Long-favored by the desperate traders of Glorx. In this thing they weren't even afraid to dive into the depths of Necross' swamps looking for cirt! They carried away so much loot from Xplo, fighting off those greedy rangers. How much, only those rangers can tell you now, through their broken teeth. Those who have ridden this thing can share a little secret with you: just don't get in its way, and it will get you out of any trouble alive."
"descriptions.mechos.02" = "Blurry Dot If all the misadventures of a vanger's life finally make you lose your marbles and you find yourself ready for one last ride into the inferno of secret worlds, here is the best hearse to accommodate your marvelous funeral. Just put the pedal to the metal, and the mechos will get you into such trouble that if luck decides to leave you even for a split-second, all memory of your brief existence will vanish forever."
"descriptions.mechos.03" = "Ripper It's not uncommon for snobby Eleepods to give anything for a rattle. They've collected heaps of scrap from all of the worlds in their escaves and now hold onto it like misers, and whoever tries to deprive them of their treasure comes to grief. The merciless killer in this craggy buggy can catch the culprit instantly. Whenever others see it speed by, they say, \"Another moron meets his fate, who dared try Leepky's treasure take.\""
"descriptions.mechos.04" = "Heavy Lady A mechos for the kings of the road. Rumor has it that the exact same chariot was used to transport a Larva for the Necross' bunches. Very few witnesses survived that jolly dance of death nearby the Plugged Passage. This fatty sure earned a lot of respect that day. Since then, lots of hot-shot vangers have gotten a lot of pride from taking her out for a ride, raising clouds of dust and tossing clumsier beebs out of the way."
"descriptions.mechos.05" = "Ancient Demon The favorite mechos of reckless rangers, adventurers, and real bandits. When you're bored, having no stupid missions to perform for the fat counselors, or when you can't put up with the abysmal number of beebs left until the next cycle anymore, come join the tribe offree ramblers. Let those hucksters scratch their heads trying to figure out where to get their stuff and where to unload for maximum beeb intake. Your only care is the time and place of your next \"hot date.\""
"descriptions.mechos.06" = "Iron Wraith The jolly raffa-hunters once rode in machines like this. (n the mountains, only these could chase down an agile, desperately struggling rattletrap or escape by water, leaving behind a furious herd that thinks you're already dead and they just have to sharpen their mandibles and gulp you down."
"descriptions.mechos.07" = "atTractor This unique mechos was once assembled from leftover parts of road construction and tunneling equipment. The crazy Beeboorats just love it. Many have had their race come to an abrupt finish under the knives of this monster. Even in heavily armored buggies, Eleepods sometimes drove themselves into ditches in panic, horrified by the sight of this \"Ride Killer.\""
"descriptions.mechos.08" = "Sandrider This unusual mechos used to belong to a castaway vanger. He once met some mysterious inhabitants on Threall, which no one else has ever seen, and they told him how to assemble this monster. After that, many have seen him in different worlds carrying out missions for his affiliates. The weapons they gave him were so tough that any vanger who spots him on the horizon just turns around and floors it. Finally, one day, this mechos was just found empty and in good condition."
"descriptions.mechos.09" = "Arcan This mechos became famous across all of the worlds thanks to one breathtaking story. The restless Zeexen once told a tale to a vanger about the King of Beebs. They said he was as big as half a mechos, with huge nippers, incredible speed, and an appetite for nothing but careless vangers. So they offered him a deal: capture the beast alive for some good money. Duped, the vanger prepared for the hunt properly. The first thing he did was to arm this mechos with a special claw. Well, the end of the story is sad but predictable. The mechos is still good for any other hunting, but definitely not for hunting the notorious king."
"descriptions.mechos.10" = "Mad Surgeon This mechos proudly bears the title of the King of the Ancients. The Eleepods dug it out while excavating their escaves. Nobody really knows how it got in there. But the Zeexen swear that buggies just like this were used by the most powerful Softie, a fabulous tribe that inhabited these worlds in the days of old. They must have been great vangers, since this mechos has won so many races by damaging its enemies. Its rusty hull still holds the spirit of its twisted first owners!"
"descriptions.mechos.11" = "Scruncher This youngster won its fame on Necross. Its flat body helps it push through undergrowth not even a beeb can get through. The fetid swamps which have gobbled up so many foolhardy vangers just sort of disgorge this mechos, refusing to swallow it. There's no pool on Necross that its wide wheels haven't ridden over."
"descriptions.mechos.12" = "Iron Coffin These mechos are all that are left of the Transmundane Bios. Legend says they were tough tribes with the best mechos and the most reckless vangers. After the bunches captured three Larvae, the others decided to take care of the thieves. Crowds of vangers blocked their escaves, preventing their mechos from entering or leaving, but these big trucks changed the game. When they first emerged, crowds of tough mechos would attack them like raffas attack a careless trader. But the crowds almost always lost to these trucks, leaving nothing behind but piles of smoldering rubble. The Transmundanes left nice gifts behind, and this one is probably the best."
"descriptions.mechos.13" = "Needle This klutz has long been a symbol of successful commerce. Who hasn't heard of the Mother of Beebs before? It sounds incredible, but whenever you stop, the beebs start to swarm around like it was smeared with honey. These beasts just adore their Mother, and that's not a fluke. All the vangers who have tried this vehicle say its pilots are never short on beebs."
"descriptions.mechos.14" = "Reanimator This tough guy has won eternal renown in the ritual races of Glorx. Even useless Zeex could manage to fill up the cargo holds with seeds (which the Beeboorats value so much, they'll pay without haggling) without loosing a single one. They could even rob several go-getters along the way! If you want to make a profit, choose this mechos and you'll never have to worry about money again."
"descriptions.mechos.15" = "The Last Mohican A mechos for the king of vangers. A true escave on wheels! Inside this, you fear nothing and no one and can ride all over any small fry in your path. Whenever this metal monster approaches the Eleepods' escaves, they can't tell what's trembling harder: their walls or their terrified fat bodies!"
"descriptions.mechos.16" = "Queen Frog In the old days, Beeboorat patrols rode these mechos while hunting for fugitive slaves. It's no secret that every vanger is a slave to the Beeboorats if he doesn't play their stupid games. No one has ever dared going up against this buggy on watery Glorx. Eventually it got so bad that no one could ride around this world safely, so the free vangers decided to give the 'vats a lesson. They fought hard and long, but the Beeboorats did them all in anyway. However, the bullies took the hint, and the patrols were abandoned. Since that time, this mechos has been sitting, waiting for its next crazy owner."
"descriptions.mechos.17" = "Lawn Mower Normal vangers are perplexed by this slipshod mechos. Vangers are used to riding on land rather than messing around in the air. Plus, it has an evil back story. Rumor has it that, at the beginning of time, horrible \"soft\" vangers pursued our ancestors, trying to get the Larvae. The only refuge they could find was underground, in the escaves. Another rumor says there's a whole world of Softie anxiously awaiting their chance to rush in, bringing total annihilation with them."
"descriptions.mechos.18" = "BLOCH A long time ago, the Transmundane Bios assembled these marvelous mechos to fight the multiplying beebs that mucked up their underground plantations. No vermin could escape from the brave hunters in these speedy buggies. They got so good at slaying the poor chiggers that the beebs instinctively hide themselves in deep cracks for a very long time whenever they see this mechos."
"descriptions.mechos.19" = "SMOK This mechos is the raffas' favorite. You can always hide in a crack somewhere and wait for your pursuers to leave! One story says that a certain thief using this ride got away from two hunters in trucks after stealing hash from the Eleepods' counselor. He slipped between their wheels, and the two collided and blew up. Later, a couple of ripe stinkhorns shot the guy, but that's a different story."
"descriptions.mechos.20" = "MOTOK This wagon is best for those who like to watch a fight from a distance. While those blockheads beat each other up, you can just take a moment to grab the items they've dropped and take off with them. Or you can attack someone with impunity. An agile raffa can always get beebs without getting into trouble."
"descriptions.mechos.21" = "SHROT Raffas are small but agile and wicked. And when these cockroaches start to swarm, the traders gotta keep a good eye on their stuff! On Necross, there used to be a big clump of rebellious fitters riding in these rattletraps, and they hunted properly. After one group forced a vanger into a swamp, another one would pop up right out of the mud and finish the deal. There was a time when the snail-like Eleepods couldn't get their precious cirt because of this gang, so they had to spend lots of beebs on raffa-flushers to wipe out the blight."
"descriptions.mechos.22" = "DocHOD This puny thing doesn't really look like it could anger any skilled vangers. But no race on Fostral has gone down without this famous raffa-sled getting involved. Grabbing the precious article, he would rush to the goal, leaving all the tough guys behind as he dodges their missiles. The Eleepods loved this racer, but his biggest problem was figuring out how to leave the escave while avoiding all the losers bent on revenge."
"descriptions.mechos.35" = "Wormmaster The malicious Beeboorats made a few of these mechos to poke around the underground incubators of the Eleepods. They visited the dark caves filled with dainties for a long time, until the Eleepods raised the alarm when their ritual race failed, beginning the famous Festival of Terminators. After the next attack, Eleepod mercenaries released hundreds of terminators and took care of the thieves properly. For a long time after that, the new-purposeless mechanisms attacked passing vangers. This mechos is still waiting for the next attack from underground assassins."
