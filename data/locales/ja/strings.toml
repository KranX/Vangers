"descriptions.item.01" = "マホティン「ミンサー」\u2028探索時代の末期にソフティ部隊が使った強力な速射機関銃。内蔵の弾薬製造機は、土やほこりを化学処理し、燃焼室で高圧をかけて弾に成形する。この触媒反応は弾に強い運動エネルギーを与えるが、大量の水を消費する。地表の水場でこまめに補給が必要だ。"
"descriptions.item.27" = "ニンボス\u2028駆け出しが最初に稼ぐならこれだ。年老いたエリポッドから採れる、湿ってぬるぬるした代物。気味の悪い品だが、好む者もいる。"
"descriptions.mechos.00" = "すっぱい修道士\u2028長い歳月をくぐり抜けた古参のメホス。インキュベーター発の大レースで、改造車に乗った四人の間抜けなジークスを追い抜き、高価な武器まで叩き落とした。フォストラルには今もその目撃者がいる。運が味方する車体だ。"

