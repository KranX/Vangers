name: OSS Windows MSYS2 (script) Build

# Builds Vangers through the packaging/msys2 helper scripts. build-msys2.ps1
# installs MSYS2 with the official installer when it is not present, then
# installs the packages, builds the pinned clunk and toml11 and builds/tests
# Vangers. run-msys2.ps1 stages the runtime (executables + DLLs).

on:
  push:
    branches:
      - master
      - alpha
      - windows_scripts
  pull_request:
    branches:
      - master
      - alpha
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-windows-msys2-script-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026

    env:
      BUILD_TYPE: RelWithDebInfo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build with the MSYS2 scripts
        shell: pwsh
        run: |
          ./packaging/msys2/build-msys2.ps1 -BuildType $env:BUILD_TYPE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage runtime
        shell: pwsh
        run: |
          ./packaging/msys2/run-msys2.ps1 artifacts -NoRun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: Vangers-OSS-windows-msys2-script-x86_64
          path: artifacts
